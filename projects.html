<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Works — 정재은 Portfolio</title>
<meta name="description" content="정재은의 전체 작업물 목록 — UI/UX · WEB · AI VISUAL · 3D">
<style>
/* ---------- fonts (기획서 2쪽) ---------- */
@font-face{font-family:'Escoredream';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/S-CoreDream-4Regular.woff') format('woff');font-weight:400;font-display:swap}
@font-face{font-family:'Escoredream';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/S-CoreDream-5Medium.woff') format('woff');font-weight:500;font-display:swap}
@font-face{font-family:'Yeongdo';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2410-1@1.2/Yeongdo-Rg.woff2') format('woff2');font-weight:400;font-display:swap}

:root{
  --cream:#faf6ed; --terra:#af513d; --oat:#ddd0bb; --ink:#332b27; --apricot:#e9b89a;
  --ink-soft:#6a5d55; --line:#e6dccb;
  --f-body:'Escoredream',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-title:'Yeongdo','Escoredream',-apple-system,'Apple SD Gothic Neo',sans-serif;
  --sp1:10px; --sp2:20px; --sp3:30px; --sp4:40px; --sp6:60px; --sp8:80px; --sp10:100px;
  --r:8px; --r-sm:4px;
  --content:1280px;
  --header:70px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f-body);font-weight:400;color:var(--ink);background:var(--cream);line-height:1.7;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
body.menu-open{overflow:hidden}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--terra);outline-offset:3px}
.shell{max-width:var(--content);margin:0 auto;padding:0 var(--sp4)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header (index.html과 동일) ---------- */
.site-header{position:fixed;inset:0 0 auto 0;z-index:100;height:var(--header);background:transparent}
.site-header .shell{height:100%;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:var(--f-title);font-size:22px;letter-spacing:-.01em}
.menu-btn{width:50px;height:50px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;margin-right:-12px}
.menu-btn span{display:block;width:24px;height:2px;background:var(--ink);border-radius:2px}

/* ---------- menu overlay (index.html과 동일) ---------- */
.menu{position:fixed;inset:0;z-index:110;background:var(--oat);display:flex;align-items:center;visibility:hidden;opacity:0;transition:opacity .35s ease,visibility 0s linear .35s}
.menu.open{visibility:visible;opacity:1;transition:opacity .35s ease}
.menu-top{position:absolute;inset:0 0 auto 0;height:var(--header)}
.menu-top .shell{height:100%;display:flex;align-items:center;justify-content:space-between}
.menu-close{width:50px;height:50px;margin-right:-12px;position:relative}
.menu-close span{position:absolute;left:13px;top:24px;width:24px;height:2px;background:var(--ink);border-radius:2px;transition:transform .35s ease}
.menu-close span:nth-child(1){transform:rotate(45deg)}
.menu-close span:nth-child(2){transform:rotate(-45deg)}
.menu-close:hover span{background:var(--terra)}
.menu.open .menu-close span:nth-child(1){animation:x1 .35s ease}
.menu.open .menu-close span:nth-child(2){animation:x2 .35s ease}
@keyframes x1{from{transform:rotate(0)}}
@keyframes x2{from{transform:rotate(0)}}
.menu ul{list-style:none}
.menu li+li{margin-top:var(--sp2)}
.menu ul a{display:inline-flex;align-items:baseline;gap:var(--sp2);font-family:var(--f-title);font-size:clamp(44px,8vw,96px);line-height:1.1}
.menu ul a small{font-family:var(--f-body);font-size:14px;color:var(--ink-soft)}
.menu ul a:hover{color:var(--terra)}
.menu-foot{position:absolute;left:0;right:0;bottom:var(--sp4);font-size:14px;color:var(--ink-soft)}

/* ---------- page head ---------- */
.page-head{padding:calc(var(--header) + var(--sp8)) 0 var(--sp6)}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--ink-soft);margin-bottom:var(--sp4)}
.back-link span{color:var(--terra)}
.back-link:hover{color:var(--ink)}
.page-head .row{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--sp2);flex-wrap:wrap}
.page-head h1{font-family:var(--f-title);font-weight:400;font-size:clamp(64px,10vw,140px);line-height:1;letter-spacing:-.02em}
.page-head .sub{font-size:15px;color:var(--ink-soft);text-align:right}
.page-head .sub b{font-weight:500;color:var(--terra)}

/* ---------- filter ---------- */
.filter{display:flex;flex-wrap:wrap;gap:var(--sp1);padding:var(--sp2) 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);list-style:none}
.filter button{min-height:40px;padding:0 var(--sp2);border-radius:999px;font-size:14px;font-weight:500;color:var(--ink-soft);transition:background .2s ease,color .2s ease}
.filter button:hover{color:var(--ink);background:var(--oat)}
.filter button[aria-pressed="true"]{background:var(--ink);color:var(--cream)}
.filter .n{font-size:12px;margin-left:4px;opacity:.7}

/* ---------- grid ---------- */
.list{padding:var(--sp6) 0 var(--sp10)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp6) var(--sp3);list-style:none}
.card a,.card .inner{display:block}
.thumb{aspect-ratio:4/3;border-radius:var(--r);overflow:hidden;background:var(--oat)}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
.card a:hover .thumb img{transform:scale(1.04)}
.card-meta{margin-top:var(--sp2);display:flex;justify-content:space-between;gap:var(--sp1);font-size:13px;color:var(--ink-soft)}
.card-meta .cat{color:var(--terra);font-weight:500}
.card h2{margin-top:6px;font-size:18px;font-weight:500;line-height:1.4}
.card p{margin-top:6px;font-size:14px;color:var(--ink-soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card a:hover h2{color:var(--terra)}
.empty{padding:var(--sp10) 0;text-align:center;color:var(--ink-soft)}

.load-more{margin-top:var(--sp8);text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp1);min-height:50px;padding:0 var(--sp4);border-radius:var(--r);background:var(--terra);color:var(--cream);font-size:15px;font-weight:500;transition:background .2s ease}
.btn:hover{background:#963f2d}
.list-status{margin-top:var(--sp2);font-size:13px;color:var(--ink-soft)}

/* ---------- image footer (index.html과 동일) ---------- */
.site-footer{position:relative;height:50vh;min-height:360px;display:flex;align-items:flex-end;color:var(--cream);overflow:hidden}
.site-footer img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.site-footer::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(to bottom,rgba(51,43,39,0) 40%,rgba(51,43,39,.75))}
.site-footer .shell{position:relative;z-index:2;width:100%;padding-bottom:var(--sp4);display:flex;justify-content:space-between;align-items:flex-end;gap:var(--sp2);flex-wrap:wrap}
.f-logo{font-family:var(--f-title);font-size:clamp(32px,5vw,64px);line-height:1}
.copy{font-size:13px}

/* ---------- tablet ---------- */
@media (max-width:1023px){
  .shell{padding:0 var(--sp3)}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
/* ---------- mobile ---------- */
@media (max-width:767px){
  .shell{padding:0 var(--sp2)}
  .logo{font-size:19px}
  .page-head{padding-top:calc(var(--header) + var(--sp4))}
  .page-head .sub{text-align:left}
  .filter{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .filter::-webkit-scrollbar{display:none}
  .filter button{white-space:nowrap}
  .grid{grid-template-columns:1fr;gap:var(--sp4)}
  .load-more .btn{width:100%}
  .site-footer{height:40vh;min-height:280px}
}
</style>
</head>
<body>

<a href="#list" class="sr-only">목록으로 건너뛰기</a>

<header class="site-header">
  <div class="shell">
    <a href="index.html" class="logo">jeongjaeeun</a>
    <button class="menu-btn" type="button" aria-expanded="false" aria-controls="menu" aria-label="메뉴 열기">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<nav class="menu" id="menu" aria-label="주 메뉴">
  <div class="menu-top">
    <div class="shell">
      <a href="index.html" class="logo">jeongjaeeun</a>
      <button class="menu-close" type="button" aria-label="메뉴 닫기"><span></span><span></span></button>
    </div>
  </div>
  <div class="shell">
    <ul>
      <li><a href="index.html#about">Who am I <small>소개</small></a></li>
      <li><a href="index.html#works">Works <small>작업물</small></a></li>
      <li><a href="index.html#notes">Notes <small>기록</small></a></li>
      <li><a href="index.html#contact">Contact <small>문의</small></a></li>
    </ul>
  </div>
  <div class="menu-foot"><div class="shell">raspberry8437@gmail.com</div></div>
</nav>

<main>
  <section class="page-head">
    <div class="shell">
      <a href="index.html#works" class="back-link"><span aria-hidden="true">←</span> 메인으로</a>
      <div class="row">
        <h1>Works</h1>
        <p class="sub">All Projects · 총 <b id="total">0</b>개</p>
      </div>
    </div>
  </section>

  <section class="list" id="list" aria-label="전체 작업물">
    <div class="shell">
      <div class="filter" role="group" aria-label="분야 필터" id="filter"></div>

      <div style="margin-top:var(--sp6)">
        <ul class="grid" id="grid"></ul>
        <p class="empty" id="empty" hidden>이 분야의 프로젝트를 준비하고 있습니다.</p>
      </div>

      <div class="load-more" id="load-more" hidden>
        <button type="button" class="btn" id="more-btn">프로젝트 더 보기 <span aria-hidden="true">+</span></button>
      </div>
      <p class="list-status sr-only" id="list-status" aria-live="polite"></p>
    </div>
  </section>
</main>

<footer class="site-footer">
  <img src="img/visual.jpg" alt="" loading="lazy">
  <div class="shell">
    <span class="f-logo">jeongjaeeun</span>
    <span class="copy">© 2026 jeongjaeeun. All rights reserved.</span>
  </div>
</footer>

<script>
/* TODO: 실제 프로젝트로 바꿔주세요. 위에 있을수록 먼저 보입니다.
   url: 상세 페이지 주소 (아직 없으면 '' 로 두면 클릭되지 않는 카드로 표시) */
const PROJECTS = [
  { title:'카페 브랜드 아이덴티티', cat:'BRANDING',  year:2026, img:'img/project-1.jpg', desc:'동네 로스터리 카페의 로고, 컬러, 패키지, 메뉴판까지 하나의 톤으로 정리한 브랜딩 프로젝트', url:'' },
  { title:'모바일 주문 앱 UI',      cat:'UI/UX',     year:2026, img:'img/project-2.jpg', desc:'매장 대기 없이 미리 주문하고 픽업하는 흐름을 설계한 모바일 앱', url:'' },
  { title:'브랜드 웹사이트 리뉴얼',  cat:'WEB',       year:2025, img:'img/project-3.jpg', desc:'오래된 홈페이지를 반응형으로 다시 설계하고 직접 퍼블리싱', url:'' },
  { title:'디저트 패키지 키 비주얼', cat:'AI VISUAL', year:2025, img:'img/project-1.jpg', desc:'생성형 AI로 시즌 디저트 패키지의 키 비주얼을 제작', url:'' },
  { title:'굿즈 3D 목업',          cat:'3D',        year:2025, img:'img/project-2.jpg', desc:'Blender로 브랜드 굿즈의 3D 목업과 제품 이미지를 제작', url:'' },
  { title:'예약 서비스 UX 개선',    cat:'UI/UX',     year:2025, img:'img/project-3.jpg', desc:'예약 단계의 이탈 지점을 찾아 화면 흐름을 다시 설계', url:'' },
  { title:'베이커리 로고 리디자인',  cat:'BRANDING',  year:2024, img:'img/project-1.jpg', desc:'오래된 베이커리 로고를 현재 매장 분위기에 맞게 정리', url:'' },
  { title:'포트폴리오 랜딩 페이지',  cat:'WEB',       year:2024, img:'img/project-2.jpg', desc:'HTML·CSS로 직접 구현한 개인 랜딩 페이지', url:'' },
  { title:'공간 3D 렌더링',        cat:'3D',        year:2024, img:'img/project-3.jpg', desc:'카페 인테리어 시안을 3D로 렌더링해 공간감을 미리 확인', url:'' },
];
const CATS = ['UI/UX','WEB','BRANDING','AI VISUAL','3D'];
const STEP = 6; // 처음 6개, 이후 6개씩
const STORE = 'projects-list-state';

(function(){
  /* ---- 햄버거 메뉴 ---- */
  const btn = document.querySelector('.menu-btn');
  const menu = document.getElementById('menu');
  const closeBtn = menu.querySelector('.menu-close');
  function setMenu(open){
    btn.setAttribute('aria-expanded', open);
    menu.classList.toggle('open', open);
    document.body.classList.toggle('menu-open', open);
    if(open) closeBtn.focus(); else btn.focus();
  }
  btn.addEventListener('click', ()=> setMenu(true));
  closeBtn.addEventListener('click', ()=> setMenu(false));
  menu.querySelectorAll('a').forEach(a=> a.addEventListener('click', ()=> setMenu(false)));
  document.addEventListener('keydown', e=>{
    if(e.key === 'Escape' && menu.classList.contains('open')) setMenu(false);
  });

  /* ---- 목록 ---- */
  const grid = document.getElementById('grid');
  const filterEl = document.getElementById('filter');
  const moreWrap = document.getElementById('load-more');
  const moreBtn = document.getElementById('more-btn');
  const empty = document.getElementById('empty');
  const status = document.getElementById('list-status');
  document.getElementById('total').textContent = PROJECTS.length;

  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // 상세에서 돌아왔을 때 필터·수량·스크롤 복원
  let saved = null;
  try { saved = JSON.parse(sessionStorage.getItem(STORE)); sessionStorage.removeItem(STORE); } catch(e){}
  const urlCat = new URLSearchParams(location.search).get('cat');
  let cat = (saved && saved.cat) || (CATS.includes(urlCat) ? urlCat : 'ALL');
  let shown = (saved && saved.shown) || STEP;

  const items = () => cat === 'ALL' ? PROJECTS : PROJECTS.filter(p => p.cat === cat);

  // 필터 버튼
  ['ALL', ...CATS].forEach(c=>{
    const n = c === 'ALL' ? PROJECTS.length : PROJECTS.filter(p => p.cat === c).length;
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.cat = c;
    b.innerHTML = `${c === 'ALL' ? '전체' : esc(c)}<span class="n">${n}</span>`;
    b.addEventListener('click', ()=>{
      if(cat === c) return;
      cat = c; shown = STEP;
      const u = new URL(location.href);
      c === 'ALL' ? u.searchParams.delete('cat') : u.searchParams.set('cat', c);
      history.replaceState(null, '', u);
      render();
    });
    filterEl.appendChild(b);
  });

  function card(p){
    const body = `
      <div class="thumb"><img src="${esc(p.img)}" alt="${esc(p.title)} 대표 이미지" loading="lazy"></div>
      <div class="card-meta"><span class="cat">${esc(p.cat)}</span><span>${esc(p.year)}</span></div>
      <h2>${esc(p.title)}</h2>
      <p>${esc(p.desc)}</p>`;
    return p.url
      ? `<li class="card"><a href="${esc(p.url)}">${body}</a></li>`
      : `<li class="card"><div class="inner">${body}</div></li>`;
  }

  function render(){
    filterEl.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.cat === cat));
    const list = items();
    grid.innerHTML = list.slice(0, shown).map(card).join('');
    empty.hidden = list.length > 0;
    const rest = list.length - shown;
    moreWrap.hidden = rest <= 0;
    if(rest > 0) moreBtn.innerHTML = `프로젝트 더 보기 <span aria-hidden="true">+${Math.min(rest, STEP)}</span>`;
    status.textContent = `${Math.min(shown, list.length)}개 / 전체 ${list.length}개 표시 중`;
  }

  moreBtn.addEventListener('click', ()=>{
    const first = shown;
    shown += STEP;
    render();
    const next = grid.children[first];
    if(next){ const a = next.querySelector('a'); (a || next).setAttribute('tabindex', a ? '0' : '-1'); (a || next).focus({preventScroll:true}); }
  });

  // 상세 페이지로 이동할 때 현재 상태 저장
  grid.addEventListener('click', e=>{
    if(!e.target.closest('a')) return;
    try { sessionStorage.setItem(STORE, JSON.stringify({ cat, shown, y: scrollY })); } catch(err){}
  });

  render();
  if(saved && typeof saved.y === 'number') requestAnimationFrame(()=> scrollTo(0, saved.y));
})();
</script>

</body>
</html>
